plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zakoulok.wallpaper'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.zakoulok.wallpaper'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}
